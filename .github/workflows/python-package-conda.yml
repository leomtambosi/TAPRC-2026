name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de lint e formatação
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Checagem de ordenação de imports (isort)
        run: isort --check --diff .

      - name: Checagem de formatação (Black)
        run: black --check --diff .

      - name: Análise estática e linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Validação de sintaxe
        run: python -m py_compile function_app.py